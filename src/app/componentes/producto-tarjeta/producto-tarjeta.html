<article class="card h-100">
  @if (imagen(); as archivo) {
    <img
      class="card-img-top imagen-producto"
      [src]="'productos/' + archivo"
      width="720"
      height="480"
      loading="lazy"
      alt=""
    />
  }
  <div class="card-body d-flex flex-column p-4">
    <p class="categoria-producto mb-2">{{ producto().categoria }}</p>
    <h2 class="h5 mb-1">{{ producto().nombre }}</h2>
    <p class="text-body-secondary small mb-3">{{ producto().detalle }}</p>
    <p class="fw-semibold mb-1">{{ producto().precio | currency: 'BOB' : 'Bs' }}</p>
    <p class="small text-body-secondary mb-3">
      @if (producto().existencias > 0) {
        {{ producto().existencias }} disponibles
      } @else {
        Agotado
      }
    </p>
    <button
      class="btn btn-primary mt-auto align-self-start"
      type="button"
      [disabled]="producto().existencias === 0"
      [attr.aria-label]="'Comprar ' + producto().nombre"
      (click)="agregar.emit(producto().id)"
    >
      Comprar
    </button>
  </div>
</article>
